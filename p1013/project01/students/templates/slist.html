<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{text-align:center;}
        table{text-align:center; margin:0 auto;}
        div{text-align:center;}
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th,td{width:150px; height:40px;}
        button{width:100px; height:40px;}

    </style>
</head>
<body>
    {# 디장고html 주석  #}
    {# if,for : {% %}, 변수 : {{}}  #}
    <h1>학생정보리스트</h1>
    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>학과</th>
            <th>학년</th>
            <th>날짜</th>
        </tr>
        {% for stu in list %}
        <tr>
            <td>{{stu.no}}</td>
            <td>
                <a href='{% url "students:sview" stu.no %}'>
                    {{stu.name}}
                </a>
            </td>
            <td>{{stu.major}}</td>
            <td>{{stu.grade}}</td>
            <td>{{stu.sdate}}</td>
        </tr>
        {% endfor %}
    </table>
   
    <br><br>
    <div>
        <a href='{% url "students:swrite" %}'><button type='button'>쓰기</button></a>
        <a href='/'><button type='button'>홈으로</button></a>
    </div>
</body>
</html>
