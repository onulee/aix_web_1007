<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOREST - 회원가입 완료</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff") format("woff");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Bold.woff") format("woff");
      font-weight: 700;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* 첫 번째 소스의 상단 메뉴 */
    header { border-bottom: 1px solid #eee; background: #fff; }
    .top {
      width: min(1200px, calc(100% - 40px));
      min-height: 90px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
    .menu { display: flex; align-items: center; flex-wrap: wrap; gap: 40px; }
    .menu li { font-size: 15px; }
    .menu a:hover { color: #035fe0; }

    /* 첫 번째 소스의 이미지 배너 */
    .visual {
      min-height: 280px;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)),
        url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
    }
    .visual h1 { font-size: 42px; font-weight: 400; letter-spacing: 2px; }
    .visual p { margin-top: 15px; font-size: 16px; }

    /* 두 번째 소스의 회원가입 완료 영역 */
    .container { width: min(720px, calc(100% - 40px)); margin: 0 auto; }
    .title { text-align: center; padding: 70px 0; font-size: 30px; font-weight: 700; }
    .orderStep { text-align: center; padding-bottom: 20px; margin-bottom: 10px; }
    .orderStep ul { display: flex; justify-content: center; gap: 40px; }
    .orderStep li { display: inline-block; font-size: 14px; color: #636363; }
    .orderStep li .current { color: #035fe0; font-weight: 700; font-size: 15px; }
    .message-box {
      max-width: 600px;
      margin: 0 auto 70px;
      padding: 50px 20px;
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      text-align: center;
    }
    .message-box p {
      font-size: 18px;
      font-weight: 500;
      color: #035fe0;
      margin-bottom: 30px;
    }
    .btn-box { display: flex; justify-content: center; gap: 15px; }
    .btn {
      min-width: 160px;
      min-height: 50px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid #035fe0;
      background: #035fe0;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(.95); }
    footer {
      border-top: 1px solid #eee;
      padding: 28px 20px;
      color: #999;
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 760px) {
      .top { padding: 20px 0; flex-direction: column; justify-content: center; }
      .menu { justify-content: center; gap: 18px; }
      .visual { min-height: 220px; }
      .visual h1 { font-size: 34px; }
      .orderStep ul { gap: 18px; }
      .btn-box { flex-direction: column; gap: 10px; }
      .btn { width: 100%; }
    }
    @media (max-width: 420px) {
      .top { width: calc(100% - 28px); }
      .menu { gap: 12px; }
      .menu li { font-size: 13px; }
      .visual h1 { font-size: 30px; }
      .visual p { font-size: 14px; }
      .orderStep li { font-size: 12px; }
      .container { width: calc(100% - 28px); }
    }
  </style>
</head>
<body>
  <!-- 첫 번째 소스의 상단 메뉴 -->
  <header>
    <div class="top">
      <div class="logo"><a href="#">FOREST</a></div>
      <nav aria-label="주 메뉴">
        <ul class="menu">
          <li><a href="#">소개</a></li>
          <li><a href="#">뉴스</a></li>
          <li><a href="#">학생관리</a></li>
          <li><a href="#">학과정보</a></li>
          <li><a href="#">문의</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 첫 번째 소스의 이미지 영역 -->
  <section class="visual">
    <div>
      <h1>JOIN US</h1>
      <p>FOREST 회원가입을 통해 다양한 서비스를 이용하세요.</p>
    </div>
  </section>

  <!-- 두 번째 소스의 회원가입 완료 영역 -->
  <main class="container">
    <div class="title">회원가입</div>
    <div class="orderStep">
      <ul>
        <li>1. 약관동의</li>
        <li>2. 정보입력</li>
        <li><span class="current">3. 가입완료</span></li>
      </ul>
    </div>

    <section class="message-box" aria-label="회원가입 완료">
      <p>회원가입이 완료되었습니다.</p>
      <div class="btn-box">
        <button class="btn" type="button" onclick="location.href='/member/login/'">
          로그인 페이지로 이동
        </button>
      </div>
    </section>
  </main>

  <footer>Copyright © FOREST. All rights reserved.</footer>
</body>
</html>
