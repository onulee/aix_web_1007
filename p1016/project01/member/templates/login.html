<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOREST - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans KR", Arial, sans-serif;
            color: #333;
            background: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        /* 첫 번째 디자인: 상단 헤더 */
        header {
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        .top {
            width: min(1200px, calc(100% - 40px));
            min-height: 90px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .menu {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
        }

        .menu li {
            font-size: 15px;
        }

        .menu a:hover {
            color: #035fe0;
        }

        /* 첫 번째 디자인: 상단 이미지 배너 */
        .visual {
            min-height: 280px;
            padding: 40px 20px;
            background:
                linear-gradient(rgba(0, 0, 0, .28), rgba(0, 0, 0, .28)),
                url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85")
                center / cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        .visual h1 {
            font-size: 42px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .visual p {
            margin-top: 15px;
            font-size: 16px;
        }

        /* 두 번째 디자인: 로그인 영역 */
        .login-section {
            padding: 70px 20px 85px;
        }

        .login-box {
            width: 320px;
            max-width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 24px;
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
        }

        .input-box {
            display: block;
            width: 100%;
            height: 44px;
            margin: 8px 0;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 0;
            outline: none;
            background: #fff;
            font-size: 14px;
        }

        .input-box:focus {
            border-color: #333;
        }

        .btn {
            width: 100%;
            height: 44px;
            margin: 14px 0 12px;
            border: 0;
            border-radius: 0;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-login {
            background: #035fe0;
            color: #fff;
        }

        .btn-login:hover {
            background: #024db8;
        }

        .idsave {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #636363;
            font-size: 14px;
            text-align: left;
        }

        .idsave input {
            width: 15px;
            height: 15px;
        }

        .links {
            margin: 20px 0 26px;
            color: #636363;
            font-size: 13px;
        }

        .links a {
            margin: 0 7px;
        }

        .links a:hover {
            color: #035fe0;
            text-decoration: underline;
        }

        .signup-box {
            margin-top: 26px;
            padding: 22px 16px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .signup-box p {
            margin: 7px 0;
            color: #636363;
            font-size: 13px;
            line-height: 1.6;
        }

        .signup-box strong {
            color: #1a1a1a;
            font-size: 14px;
        }

        .btn-signup {
            width: 140px;
            height: 42px;
            margin-top: 12px;
            border: 1px solid #ccc;
            background: #fafafa;
            color: #1a1a1a;
            cursor: pointer;
        }

        .btn-signup:hover {
            background: #f0f0f0;
        }

        footer {
            padding: 28px 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .top {
                padding: 20px 0;
                flex-direction: column;
                justify-content: center;
            }

            .menu {
                justify-content: center;
                gap: 18px;
            }

            .visual {
                min-height: 220px;
            }

            .visual h1 {
                font-size: 34px;
            }

            .login-section {
                padding-top: 50px;
            }
        }

        @media (max-width: 420px) {
            .top {
                width: calc(100% - 28px);
            }

            .menu {
                gap: 12px;
            }

            .menu li {
                font-size: 13px;
            }

            .visual h1 {
                font-size: 30px;
            }

            .visual p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 첫 번째 디자인의 상단 메뉴 -->
    <header>
        <div class="top">
            <div class="logo"><a href="#">FOREST</a></div>
            <nav aria-label="주 메뉴">
                <ul class="menu">
                    <li><a href="#">소개</a></li>
                    <li><a href="#">뉴스</a></li>
                    <li><a href="#">학생관리</a></li>
                    <li><a href="#">학과정보</a></li>
                    <li><a href="#">문의</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 첫 번째 디자인의 이미지 배너 -->
    <section class="visual">
        <div>
            <h1>LOGIN</h1>
            <p>로그인 후 다양한 서비스를 이용하세요.</p>
        </div>
    </section>

    <!-- 두 번째 디자인의 로그인 영역 -->
    <main class="login-section">
        <section class="login-box" aria-labelledby="login-title">
            <h2 id="login-title">로그인</h2>

            <form action="#" method="post">
                <!-- Django에서 사용할 경우 아래 주석을 해제하세요.
                {% csrf_token %}
                -->
                <label for="user-id" class="sr-only"></label>
                <input
                    type="text"
                    id="user-id"
                    name="username"
                    class="input-box"
                    placeholder="아이디"
                    autocomplete="username"
                    required
                >

                <label for="user-password" class="sr-only"></label>
                <input
                    type="password"
                    id="user-password"
                    name="password"
                    class="input-box"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="btn btn-login">로그인</button>

                <div class="idsave">
                    <input type="checkbox" id="rememberId" name="rememberId">
                    <label for="rememberId">아이디 저장</label>
                </div>
            </form>

            <div class="links">
                <a href="#">아이디 찾기</a> |
                <a href="#">비밀번호 찾기</a>
            </div>

            <div class="signup-box">
                <p><strong>아직 회원이 아니신가요?</strong></p>
                <p>지금 회원가입을 하시면<br>다양하고 특별한 혜택이 준비되어 있습니다.</p>
                <button type="button" class="btn-signup" onclick="location.href='#'">회원가입</button>
            </div>
        </section>
    </main>

    <footer>
        Copyright © FOREST. All rights reserved.
    </footer>
</body>
</html>
