{% extends 'base.html' %}

{% block title %}회원가입 - 여행메이트{% endblock %}

{% block content %}
<div class="auth-box auth-box-join">
    <h2>회원가입</h2>

    {% if msg %}
    <p class="auth-msg">{{ msg }}</p>
    {% endif %}

    <form method="post" action="{% url 'member:join' %}" id="joinForm">
        {% csrf_token %}
        <div class="form-row">
            <label for="id">아이디</label>
            <div class="id-check-row">
                <input type="text" name="id" id="id" maxlength="30" aria-describedby="id-check-message" required>
                <button type="button" class="id-check-button" id="id-check-button">중복확인</button>
            </div>
            <p id="id-check-message" class="id-check-message" aria-live="polite"></p>
        </div>
        <div class="form-row">
            <label for="pw">비밀번호</label>
            <input type="password" name="pw" id="pw" required>
        </div>
        <div class="form-row">
            <label for="pw2">비밀번호 확인</label>
            <input type="password" id="pw2" required>
        </div>
        <div class="form-row">
            <label for="name">이름</label>
            <input type="text" name="name" id="name" required>
        </div>
        <div class="form-row">
            <label for="nickname">닉네임</label>
            <input type="text" name="nickname" id="nickname" required>
        </div>
        <div class="form-row">
            <label for="tel">전화번호</label>
            <input type="text" name="tel" id="tel" placeholder="010-1234-5678">
        </div>
        <div class="form-row">
            <label>성별</label>
            <div class="choice">
                <label><input type="radio" name="gender" value="남자" checked> 남자</label>
                <label><input type="radio" name="gender" value="여자"> 여자</label>
            </div>
        </div>
        <div class="form-row">
            <label for="age_group">연령대</label>
            <select name="age_group" id="age_group" required>
                <option value="">연령대를 선택해 주세요</option>
                <option value="10대 이하">10대 이하</option>
                <option value="20대">20대</option>
                <option value="30대">30대</option>
                <option value="40대">40대</option>
                <option value="50대">50대</option>
                <option value="60대 이상">60대 이상</option>
            </select>
            <div class="form-row">
            <label for="living_region">살고 있는 지역</label>
            <select name="living_region" id="living_region" required>
                <option value="">거주 지역을 선택해 주세요</option>
                {% for region in regions %}
                <option value="{{ region }}">{{ region }}</option>
                {% endfor %}
            </select>
            </div>

            <div class="form-row">
            <label for="interest_region">관심 있는 지역</label>
            <select name="interest_region" id="interest_region" required>
                <option value="">관심 지역을 선택해 주세요</option>
                {% for region in regions %}
                <option value="{{ region }}">{{ region }}</option>
                {% endfor %}
            </select>
            </div>
            </div>
        <button type="submit" class="btn-main">가입하기</button>
    </form>

    <p class="auth-link">이미 회원이신가요? <a href="{% url 'member:login' %}">로그인</a></p>
</div>
{% endblock %}

{% block script %}
<script>
$(function(){
    let checkedId = null;
    const input = $('#id');
    const message = $('#id-check-message');
    const button = $('#id-check-button');

    input.bind('input', function(){
        checkedId = null;
        message.text('').removeClass('available');
    });

    button.bind('click', async function(){
        const value = input.val().trim();
        input.val(value);
        checkedId = null;
        message.removeClass('available');
        if (!value) {
            message.text('아이디를 입력해 주세요.');
            input.focus();
            return;
        }
        button.prop('disabled', true);
        message.text('확인 중입니다.');
        try {
            const response = await fetch("{% url 'member:check_id' %}?" + new URLSearchParams({id: value}), {cache: 'no-store'});
            if (!response.ok) throw new Error('check failed');
            const result = await response.json();
            if (input.val().trim() !== value) return;
            checkedId = result.available ? value : null;
            message.text(result.message).toggleClass('available', result.available);
        } catch (error) {
            message.text('중복확인을 하지 못했습니다. 다시 시도해 주세요.');
        } finally {
            button.prop('disabled', false);
        }
    });

    // 보내기 전에 비밀번호 두 칸이 같은지 확인
    $('#joinForm').submit(function(){
        if (checkedId === null || input.val().trim() !== checkedId) {
            message.text('아이디 중복확인을 해 주세요.').removeClass('available');
            input.focus();
            return false;
        }
        if ($('#pw').val() != $('#pw2').val()) {
            alert('비밀번호가 서로 다릅니다.');
            $('#pw2').focus();
            return false;              // 전송 막기
        }
    });
});
</script>
{% endblock %}
