 {% extends 'base.html' %}

{% block title %}로그인 - 여행메이트{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>로그인</h2>

    {% if request.GET.joined %}
    <p class="auth-msg ok">회원가입이 완료됐습니다. 로그인해 주세요.</p>
    {% endif %}
    {% if msg %}
    <p class="auth-msg">{{ msg }}</p>
    {% endif %}

    <form method="post" action="{% url 'member:login' %}">
        {% csrf_token %}
        <div class="form-row">
            <label for="id">아이디</label>
            <input type="text" name="id" id="id" value="{{ id }}" required>
        </div>
        <div class="form-row">
            <label for="pw">비밀번호</label>
            <input type="password" name="pw" id="pw" required>
        </div>
        <button type="submit" class="btn-main">로그인</button>
    </form>

    <p class="auth-link">아직 회원이 아니신가요? <a href="{% url 'member:join' %}">회원가입</a></p>
</div>
{% endblock %}
