<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차트그래프</title>
<link rel='stylesheet' href='/static/css/bview.css'>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.8.0/dist/Chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!-- HEADER -->
<header>
<div class="top">
<div class="logo">
            FOREST
        </div>
<ul class="menu">
<li><a href="#">소개</a></li>
<li><a href="#">뉴스</a></li>
<li><a href="#">학생관리</a></li>
<li><a href="#">학과정보</a></li>
<li><a href="#">문의</a></li>
</ul>
</div>
</header>
<!-- VISUAL -->
<section class="visual">
<div>
<h1>NEWS</h1>
<p>포레스트의 새로운 소식을 만나보세요.</p>
</div>
</section>
<main>
    <button onclick='chartBtnAjax()'>차트그리기</button>
    <div class="container">
        <div id='cht'>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        
        //console.log({{id_list}});
        //console.log({{bhit_list}});
        function chartBtnAjax(){
            alert('ajax 데이터 가져오기');
            let c_label = [];
            let c_data = [];
            $.ajax({
                url:'/board/chart_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{},
                dataType:'json',
                success:function(data){
                    console.log('확인 : ',data);
                    alert('성공');
                    data.qs_value.forEach(
                        function(d){
                            c_label.push(d.id);
                            c_data.push(d.bhit);
                        }
                    )
                    console.log('c_label : ',c_label);
                    console.log('c_data : ',c_data);

                    //차트그래프------------------------------------------
                    const ctx = document.getElementById('myChart');

                    //기존데이터 삭제후 다시 가져오기
                    let chartStatus = Chart.getChart("myChart");
                    if(chartStatus != undefined){
                    console.log("success");
                    chartStatus.destroy();
                    }


                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                        labels: c_label,
                        datasets: [{
                            label: '# of Votes',
                            data: c_data,
                            borderWidth: 1
                        }]
                        },
                        options: {
                        scales: {
                            y: {
                            beginAtZero: true
                            }
                        }
                        }
                    });   




                },
                error:function(){
                    alert('실패');
                }

            });//ajax

        }

        function chartBtn(){
            alert('차트그래프를 가져옵니다.');
            //차트그래프------------------------------------------
            const ctx = document.getElementById('myChart');
            new Chart(ctx, {
                type: 'bar',
                data: {
                labels: [1,2,3,4,5,6],
                datasets: [{
                    label: '# of Votes',
                    data: [10,20,30,40,50,60],
                    borderWidth: 1
                }]
                },
                options: {
                scales: {
                    y: {
                    beginAtZero: true
                    }
                }
                }
            });
            //---------------------------------------------------

        }//chartBtn
    </script>

</main>
