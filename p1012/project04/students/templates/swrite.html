<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>학생정보입력</h1>
    <form action='/students/swrite/' name='frm' method='post'>
        {# 디장고 주석 : {% for,if %}   {{name}} #}
        {% csrf_token %}
        <label>이름</label>
        <input type='text' name='name' id='name'><br>
        <label>학과</label>
        <input type='text' name='major' id='major'><br>
        <label>학년</label>
        <input type='text' name='grade' id='grade'><br>
        <label>나이</label>
        <input type='text' name='age' id='age'><br>
        <label>성별</label><br>
        <input type='radio' name='gender' id='man' value='남자'>
        <label for='man'>남자</label>
        <input type='radio' name='gender' id='woman' value='여자'>
        <label for='woman'>여자</label>
        <br>
        <label>취미</label><br>
        <input type='checkbox' name='hobby' id='game' value='게임'>
        <label for='game'>게임</label>
        <input type='checkbox' name='hobby' id='golf' value='골프'>
        <label for='golf'>골프</label>
        <input type='checkbox' name='hobby' id='swim' value='수영'>
        <label for='swim'>수영</label>
        <input type='checkbox' name='hobby' id='run' value='조깅'>
        <label for='run'>조깅</label>
        <input type='checkbox' name='hobby' id='book' value='독서'>
        <label for='book'>독서</label>
        
        <br>
        <br>
        <input type='submit' value='저장'>
        <a href='/students/slist/'><button type='button'>취소</button></a> 
        <br>


    </form>
</body>
</html>
