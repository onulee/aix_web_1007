<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border:1px solid black; border-collapse:collapse;}
        th,td{width:150px; height:40px;}
    </style>
</head>
<body>
    {# 명령어 : {% for, if %}, 변수 : {{ }}  #}
    <h1>학생정보리스트</h1>
    <table>
        <tr>
            <th>이름</th>
            <th>학과</th>
            <th>나이</th>
        </tr>
        {% for s in list %}
        <tr>
            <td>
                <a href='/students/sview/{{s.name}}'>{{s.name}}</a>
            </td>
            <td>{{s.major}}</td>
            <td>{{s.age}}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href='/students/swrite/'><button>정보입력</button></a>
    <a href='/'><button>홈으로</button></a>
    <br>
</body>
</html>
